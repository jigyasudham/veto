name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run on the same ref is not worth the minutes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination — a partial matrix tells you less than nothing.
      fail-fast: false
      matrix:
        # Both platforms, deliberately. The same-millisecond council-verdict bug
        # passed on Windows and failed on Linux purely on machine speed, so a
        # single-OS matrix can hide a real defect in either direction.
        os: [ubuntu-latest, windows-latest]
        # 22.13 is the real floor — node:sqlite exists from 22.5 but only behind
        # --experimental-sqlite until 22.13/23.4, and CI proved 22.5 red on both
        # platforms. 22 is the latest of that line; 24 is what development runs on.
        node: ['22.13', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # npm ci, not npm install: it installs strictly from the lockfile, so a run
      # cannot silently drift onto different dependency versions than the ones
      # pinned. Viable now that this PR brings package-lock.json back in sync with
      # package.json (it had been stale at 2.1.1).
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run build

      - name: Test
        run: npm test

  # Veto pins an exact version of @jigyasudham/veto-model. If that version is
  # not resolvable on the registry, every fresh install of Veto 404s at the
  # dependency step — the failure the two-package split can cause, and the one
  # this gate exists to make impossible to ship (council condition A1).
  #
  # This is not paranoia about a publish failing. During the 1.0.0 pairing the
  # publish returned 200 and the version document was live, yet `npm install`
  # 404'd for several minutes because the packument had not reached the read
  # CDN. Publish status is not resolution status, so resolution is what gets
  # asserted here.
  model-pin:
    name: model pin resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Assert the pin is exact and resolvable
        run: |
          node -e '
            const pkg = require("./package.json");
            const name = "@jigyasudham/veto-model";
            const pin = (pkg.dependencies || {})[name];
            if (!pin) {
              console.error(`${name} is not in dependencies.`);
              process.exit(1);
            }
            // A range would let the embedding table change under a published
            // Veto version, which is exactly what pinning is for.
            if (!/^\d+\.\d+\.\d+$/.test(pin)) {
              console.error(`${name} must be pinned exactly, got "${pin}".`);
              process.exit(1);
            }
            console.log(`${name}@${pin}`);
            require("fs").writeFileSync("pin.txt", pin);
          '
          PIN=$(cat pin.txt)
          echo "Resolving @jigyasudham/veto-model@$PIN on the registry…"
          RESOLVED=$(npm view "@jigyasudham/veto-model@$PIN" version 2>/dev/null || true)
          if [ "$RESOLVED" != "$PIN" ]; then
            echo "::error::@jigyasudham/veto-model@$PIN does not resolve on the registry."
            echo "Publish the model package first and wait for it to be installable."
            exit 1
          fi
          echo "OK — resolves to $RESOLVED."

      # Resolving is necessary but not sufficient: the published bytes must also
      # be the ones the golden vectors were blessed against (condition A4).
      - name: Install from the registry and verify the payload
        run: |
          npm ci --no-audit --no-fund
          node -e '
            const { paths } = require("@jigyasudham/veto-model");
            const h = require(paths.header);
            console.log(`payload ${h.vocab_size} x ${h.dim}, upstream ${h.upstream.model_id}@${h.upstream.revision.slice(0,12)}`);
            if (h.format !== "veto-model/1") { console.error("unexpected payload format"); process.exit(1); }
          '

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # The npm tarball must never carry internal docs, local databases, or
      # captured transcripts. package.json's "files" allowlist is what enforces
      # this today; this job fails the build if that allowlist is ever loosened,
      # rather than finding out after publish.
      - name: Assert the tarball ships nothing unexpected
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const raw = JSON.parse(require("fs").readFileSync("pack.json", "utf8"));
            // npm <=11 emits an array here; npm 12 emits an object keyed by package
            // name. Normalise so an npm upgrade cannot quietly break this guard.
            const pack = Array.isArray(raw) ? raw : Object.values(raw);
            const files = pack[0].files.map(f => f.path.split("\\").join("/"));
            const allowed = new Set(["README.md", "LICENSE", "package.json", "server.json"]);
            const bad = files.filter(f => !f.startsWith("dist/") && !allowed.has(f));
            if (bad.length) {
              console.error("Unexpected files in the npm tarball:\n  " + bad.join("\n  "));
              process.exit(1);
            }
            console.log(`OK — ${files.length} files, all within dist/ or the allowed root set.`);
          '
