name: release

# Publishing from CI rather than a laptop, for one reason: npm can only attest
# provenance from a supported CI with OIDC. A local `npm publish --provenance`
# fails outright, which is why 3.0.0 and veto-model@1.0.0 both shipped without
# it (council condition A3 asked for 2FA *and* provenance; only the 2FA half
# held). Provenance ties a published tarball to the commit and workflow that
# built it, so a compromised npm account alone cannot ship altered bytes.
#
# Auth is OIDC trusted publishing, not a stored token. npm exchanges this
# workflow's short-lived OIDC identity for publish rights, so there is no
# NPM_TOKEN secret to leak, rotate, or forget to scope — and provenance is
# emitted automatically, no `--provenance` flag required. The trade is that
# trust lives in npm's package settings rather than this file: the configured
# repository and workflow filename must match exactly, so renaming this file
# breaks publishing until npm is updated to match.
#
# Manual by design — `workflow_dispatch`, not a tag trigger. Releases here have
# always been a deliberate act with checks either side, and a tag push is too
# easy to do by accident for something immutable.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for provenance. Without it npm cannot mint the attestation and the
  # publish silently degrades to an unattested one.
  id-token: write

jobs:
  release:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. Node 24 bundles an npm that may
      # or may not clear that line depending on the patch release the runner
      # happens to have, and a silent shortfall here fails at the publish step
      # after every other gate has passed. Pin the floor explicitly instead.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          node -e '
            const v = require("child_process").execSync("npm --version").toString().trim();
            const [maj, min, pat] = v.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error(`::error::npm ${v} is below the 11.5.1 trusted-publishing floor`); process.exit(1); }
            console.log(`npm ${v} supports trusted publishing.`);
          '

      - name: Install
        run: npm ci --no-audit --no-fund

      # Everything the test workflow asserts, re-asserted here. A release must
      # never be the first place a check runs.
      - name: Typecheck
        run: npm run build

      - name: Test
        run: npm test

      # Condition A1. Veto pins an exact veto-model version; if that version is
      # not installable, every fresh install of this release 404s at the
      # dependency step. Checked again at release because the registry state
      # can differ from when the branch was last tested.
      - name: Assert the model pin resolves
        run: |
          PIN=$(node -p "require('./package.json').dependencies['@jigyasudham/veto-model']")
          case "$PIN" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::model pin must be exact, got '$PIN'"; exit 1 ;;
          esac
          RESOLVED=$(npm view "@jigyasudham/veto-model@$PIN" version 2>/dev/null || true)
          if [ "$RESOLVED" != "$PIN" ]; then
            echo "::error::@jigyasudham/veto-model@$PIN does not resolve — publish the model first."
            exit 1
          fi
          echo "model pin $PIN resolves."

      # Provenance binds the artifact to the repository that built it, and npm
      # validates that binding against package.json. If repository.url is absent
      # or disagrees, the registry rejects the upload with a 422 *after* the
      # bundle has been signed and written to the public transparency log —
      # every gate green, a signature burned, and nothing published. 3.1.1 hit
      # exactly that: the field had never existed, which no dry run could reveal
      # because a dry run never signs anything.
      - name: Assert repository metadata matches this repo
        run: |
          node -e '
            const p = require("./package.json");
            const url = p.repository && (typeof p.repository === "string" ? p.repository : p.repository.url) || "";
            const want = "github.com/${{ github.repository }}";
            if (!url) { console.error("::error::package.json has no repository.url — npm will reject the provenance bundle with a 422"); process.exit(1); }
            if (!url.includes(want)) { console.error(`::error::package.json repository.url is "${url}", which does not match ${want}`); process.exit(1); }
            console.log(`repository.url ${url} matches ${want}.`);
          '

      # Publishing the same version twice fails with a 409 and leaves a
      # confusing half-run; catching it here says why in one line.
      - name: Assert this version is unpublished
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@jigyasudham/veto@$V" version >/dev/null 2>&1; then
            echo "::error::@jigyasudham/veto@$V is already published. Bump the version."
            exit 1
          fi
          echo "@jigyasudham/veto@$V is unpublished — proceeding."

      - name: Verify tarball contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const raw = JSON.parse(require("fs").readFileSync("pack.json", "utf8"));
            const pack = Array.isArray(raw) ? raw : Object.values(raw);
            const files = pack[0].files.map(f => f.path.split("\\").join("/"));
            const allowed = new Set(["README.md", "LICENSE", "package.json", "server.json"]);
            const bad = files.filter(f => !f.startsWith("dist/") && !allowed.has(f));
            if (bad.length) {
              console.error("Unexpected files in the npm tarball:\n  " + bad.join("\n  "));
              process.exit(1);
            }
            console.log(`OK — ${files.length} files.`);
          '

      # No NODE_AUTH_TOKEN. Authentication is the OIDC exchange described at the
      # top of this file, and provenance is emitted automatically as part of it.
      # If npm rejects this with an auth error, the trusted publisher on
      # npmjs.com is missing or its repo/workflow filename does not match.
      - name: Publish
        if: ${{ inputs.dry_run == false }}
        run: npm publish --access public

      - name: Dry run notice
        if: ${{ inputs.dry_run == true }}
        run: echo "Dry run — every gate passed, nothing published. Re-run with dry_run=false to publish."
